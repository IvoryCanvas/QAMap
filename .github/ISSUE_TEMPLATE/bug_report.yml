name: Bug report
description: Report a CLI failure, incorrect result, or compatibility problem.
title: "Fix: "
labels: ["type: fix"]
assignees: ["ivory-code"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove private source, repository names, customer data, paths, and secrets. A small public reproduction is best.
  - type: input
    id: version
    attributes:
      label: QAMap version
      placeholder: "0.4.11"
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command
      placeholder: "npx --yes @ivorycanvas/qamap@latest qa"
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the failure in one or two paragraphs.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Provide safe steps, a small fixture, or a public repository and commit.
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Paste only the relevant output and preserve its execution state.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should QAMap have returned, selected, or refused to claim?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Optional environment details, suspected boundary, or acceptance ideas.
    validations:
      required: false
