name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore pnpm caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/node/corepack
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-10.32.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-10.32.1-
      - name: Set up pnpm
        shell: bash
        timeout-minutes: 2
        run: |
          corepack enable pnpm
          for attempt in 1 2 3; do
            if timeout 30s pnpm --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build once
        run: pnpm build
      - name: Run tests
        run: pnpm test:compiled
      - name: Validate plugin metadata
        run: pnpm plugin:check
      - name: Smoke-test the packed plugin
        run: pnpm plugin:smoke:compiled
      - name: Run deterministic QA benchmarks
        run: pnpm bench:ci:compiled
      - name: Validate the offline agent benchmark
        run: pnpm bench:agent:compiled --dry-run --assert
      - name: Validate context reuse
        run: pnpm bench:context:compiled
      - name: Scan repository policy
        run: pnpm scan:compiled

  execution-benchmark:
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Restore pnpm caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/node/corepack
            ~/.local/share/pnpm/store
          key: pnpm-${{ runner.os }}-10.32.1-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-10.32.1-
      - name: Set up pnpm
        shell: bash
        timeout-minutes: 2
        run: |
          corepack enable pnpm
          for attempt in 1 2 3; do
            if timeout 30s pnpm --version; then
              exit 0
            fi
            if [ "$attempt" -lt 3 ]; then
              sleep $((attempt * 2))
            fi
          done
          exit 1
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build once
        run: pnpm build
      - name: Run execution benchmarks
        run: pnpm bench:execution:compiled
