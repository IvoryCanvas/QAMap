<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="800" viewBox="0 0 1600 800" role="img" aria-labelledby="title description">
  <title id="title">QAMap</title>
  <desc id="description">병합 전에 무엇을 테스트할지 확인하세요. 코드 변경을 근거로 필요한 QA를 정리합니다.</desc>
  <rect width="1600" height="800" fill="#07111F"/>

  <g font-family="'Apple SD Gothic Neo', 'Noto Sans KR', 'Malgun Gothic', Inter, sans-serif">
    <text x="128" y="255" fill="#F4F7FB" font-size="118" font-weight="700">QAMap</text>
    <text x="128" y="350" fill="#F4F7FB" font-size="46" font-weight="700">병합 전에 무엇을 테스트할지 확인하세요.</text>
    <text x="128" y="410" fill="#20BCEB" font-size="31">코드 변경을 근거로 필요한 QA를 정리합니다.</text>
  </g>

  <g transform="translate(840 30) scale(.68)" shape-rendering="geometricPrecision">
